# Isolated preview stack for the Bride & Groom visual branch.
# Run with the repository's existing docker/.env as the env file.
services:
  postgres:
    container_name: wow-bride-groom-preview-postgres
    volumes:
      - wow_bride_groom_preview_postgres:/var/lib/postgresql/data

  redis:
    container_name: wow-bride-groom-preview-redis
    volumes:
      - wow_bride_groom_preview_redis:/data

  backend:
    container_name: wow-bride-groom-preview-backend
    volumes:
      - wow_bride_groom_preview_media:/app/media-store
    environment:
      APP_BASE_URL: http://localhost:8180
      CORS_ORIGINS: http://localhost:8180,http://127.0.0.1:8180

  frontend:
    container_name: wow-bride-groom-preview-frontend

volumes:
  wow_bride_groom_preview_postgres:
  wow_bride_groom_preview_redis:
  wow_bride_groom_preview_media:
